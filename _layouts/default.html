<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-E00L9PT3V9"></script>
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-E00L9PT3V9');
    </script>

    <title>{{ site.name }}{% if page.title %}: {{ page.title }}{% endif %}</title>

    <meta charset="utf-8">
    <meta name="author" content="{{ site.name }}">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="/assets/css/font-awesome.min.css">
    <link rel="stylesheet" href="/assets/css/academicons.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="icon" href="/favicon.ico">
    <style>
        /* Navigation bar */
        .site-nav {
            background-color: #ffffff;
            padding: 10px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            width: 100%;
        }
        .nav-container {
            max-width: 860px;
            margin: 0 auto;
            background-color: #e8e7e7;
            border-radius: 10px;
            padding: 10px 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .site-nav ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        .site-nav li {
            display: inline-block;
            margin: 0 15px;
        }
        .site-nav a {
            text-decoration: none;
            color: #333 !important;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 0.04em;
        }
        .site-nav a:hover {
            color: #0056b3 !important;
        }
        .site-nav .active a {
            color: #0056b3 !important;
        }

        /* Page layout */
        .page-container {
            max-width: 860px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .content-wrapper {
            padding-top: 20px;
            padding-bottom: 40px;
        }
        .main-content {
            max-width: 100%;
            line-height: 1.6;
        }
        .main-content > p {
            text-align: justify;
            margin-bottom: 1.2em;
        }

        /* Research/project entry layout */
        .entry-row {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            align-items: flex-start;
        }
        .entry-thumb {
            flex: 0 0 160px;
            max-width: 160px;
        }
        .entry-thumb img {
            width: 100%;
            height: auto;
            border-radius: 5px;
        }
        .entry-body {
            flex: 1;
        }
        .entry-body h3 {
            color: darkblue;
            margin-bottom: 6px;
            font-size: 1em;
            text-align: left;
        }
        .entry-body .entry-links a {
            margin-right: 6px;
        }
        .entry-body .entry-sup {
            color: darkblue;
            font-weight: 600;
        }

        /* Section dividers */
        .section-divider {
            border: 0;
            border-top: 1px solid #e5e5e5;
            margin: 30px 0;
        }

        @media (max-width: 767px) {
            body { padding: 10px 5px; }
            .nav-container {
                border-radius: 0;
                padding: 8px 10px;
            }
            .site-nav li { margin: 0 8px; }
            .site-nav a { font-size: 12px; }
            .entry-row { flex-direction: column; }
            .entry-thumb { max-width: 100%; }
        }
    </style>
</head>

<body>
    <!-- Navigation bar -->
    <nav class="site-nav">
        <div class="nav-container">
            <ul>
                <li class="{% if page.url == '/' or page.url == '/index.html' %}active{% endif %}">
                    <a href="/">About</a>
                </li>
                <!-- <li class="{% if page.url contains '/research' %}active{% endif %}">
                    <a href="/research">Research</a>
                </li>
                <li class="{% if page.url contains '/projects' %}active{% endif %}">
                    <a href="/projects">Projects</a>
                </li> -->
                <li class="{% if page.url contains '/past-experience' %}active{% endif %}">
                    <a href="/past-experience">Past Experience</a>
                </li>
                <li>
                    <a href="https://drive.google.com/file/d/1bJ4eS-KFOy7JOaItBHn1EGHakyBJru0x/view?usp=sharing" target="_blank">CV</a>
                </li>
                <li>
                    <a href="https://asifhaider.github.io/blog" target="_blank">Blog</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="page-container{% if page.class %} {{ page.class }}{% endif %}">
        <div class="content-wrapper">
            <div class="main-content" role="main">
                {{ content }}
            </div>
        </div>
    </div>

</body>
</html>
